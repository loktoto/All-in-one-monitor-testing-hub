name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Record portable executable size
        shell: pwsh
        run: |
          $size = (Get-Item target/release/hardware-hub.exe).Length
          "Portable executable: $size bytes" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: hardware-hub-windows-${{ matrix.arch }}
          path: target/release/hardware-hub.exe
