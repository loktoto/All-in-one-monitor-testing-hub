[package]
name = "hardware-hub"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "A local hardware monitor and bounded manual test bench"
license = "MIT"
authors = ["Loktoto"]
repository = "https://github.com/loktoto/All-in-one-monitor-testing-hub"
readme = "README.md"
keywords = ["hardware", "monitor", "diagnostics", "egui", "desktop"]
categories = ["gui", "hardware-support", "visualization"]

[dependencies]
egui_plot = "0.31"
sysinfo = "0.33"
nvml-wrapper = "0.11"
wgpu = "24"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

# X11 is only needed on Linux. On macOS (CGL) and Windows the window is created
# natively, so requesting the X11 backend there pulls unused system libraries.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }

# Windows reports temperature through the ACPI thermal zones: the WMI class in
# ROOT\WMI (elevated only) and the "Thermal Zone Information" performance
# counters in ROOT\CIMV2 (readable as a standard user). `sysinfo` has no
# component provider on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
ureq = { version = "~3.2.1", default-features = false }
wmi = "0.18"

[profile.release]
opt-level = 3
# Thin LTO stalls for many minutes in the MSVC linker on some machines; keep
# optimisation high but skip LTO so `cargo build --release` always finishes.
lto = false
codegen-units = 16
strip = true

# Naga translates the benchmark shaders during setup. Keep the generated shader
# and the rest of the test workload at the usual release optimisation level.
[profile.release.package.naga]
opt-level = "s"
